<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="cwd">font</dir>

  <!-- PUA 14-seg letters (U+E000–U+E019) and official segmented digits. -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <range>
          <int>57344</int>
          <int>57369</int>
        </range>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Segmented Alpha</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <range>
          <int>129008</int>
          <int>129017</int>
        </range>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Segmented Alpha</string>
    </edit>
  </match>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Cascadia Mono</family>
      <family>Segmented Alpha</family>
      <family>Noto Sans Symbols2</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>Cascadia Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Segmented Alpha</string>
    </edit>
  </match>
</fontconfig>
